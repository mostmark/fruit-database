%prod.quarkus.datasource.db-kind=mysql
%prod.quarkus.datasource.username=myuser
%prod.quarkus.datasource.password=mypassword
%prod.quarkus.datasource.jdbc.url=jdbc:mysql://mysql:3306/fruitdb
%prod.quarkus.datasource.jdbc.max-size=8
%prod.quarkus.datasource.jdbc.min-size=2
%prod.quarkus.datasource.jdbc.additional-jdbc-properties.connectTimeout=5000

quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.sql-load-script=import.sql
quarkus.openshift.route.expose=true
quarkus.openshift.route.tls.termination=edge
quarkus.openshift.route.tls.insecure-edge-termination-policy=Redirect
quarkus.package.jar.type=uber-jar
quarkus.kubernetes-client.trust-certs=true
quarkus.openshift.labels.app=fruit-database

# Dev Spaces: bind dev mode to all interfaces so the workspace gateway can reach it
%dev.quarkus.http.host=0.0.0.0